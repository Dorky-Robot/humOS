[package]
name = "humos"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.102"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
mail-parser = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
